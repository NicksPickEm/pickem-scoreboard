<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick's Pick 'Em — 2026 Season</title>
<style>
  :root {
    --slate: #2e3440;
    --slate-dark: #12161c;
    --slate-light: #4c5666;
    --teal: #3d5a8a;
    --teal-bright: #3d5a8a;
    --orange: #3d5a8a;
    --page-bg: #eceff2;
    --card-bg: #ffffff;
    --row-alt: #f4f6f7;
    --green: #12726f;
    --green-bg: #e0f4f2;
    --red: #a53232;
    --red-bg: #fbeaea;
    --ink: #2e3440;
    --muted: #62707c;
    --line: #dde2e6;
    --player-col-width: 72px;
    --total-col-width: 30px;
  }
  html[data-theme="dark"] {
    --slate: #12161c;
    --slate-dark: #05070a;
    --slate-light: #2e3540;
    --teal: #8fa3c4;
    --teal-bright: #a8bede;
    --orange: #8fa3c4;
    --page-bg: #1c2128;
    --card-bg: #262c36;
    --row-alt: #2e3540;
    --green: #7fd9a6;
    --green-bg: #163826;
    --red: #e69090;
    --red-bg: #3a1a1a;
    --ink: #dfe4e8;
    --muted: #9aa5ad;
    --line: #38414c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    padding: 32px 16px 60px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; position: relative; }
  h1 { font-size: clamp(26px, 5vw, 40px); margin: 0 0 6px; color: var(--slate); letter-spacing: -0.02em; }
  html[data-theme="dark"] h1 { color: var(--teal-bright); }
  .subtitle { color: var(--teal); font-weight: 700; font-size: 14px; }
  .last-updated { margin-top: 8px; font-size: 12px; color: var(--muted); }

  .theme-toggle {
    position: absolute;
    right: 0;
    top: 0;
    background: var(--card-bg);
    border: 1.5px solid var(--slate);
    color: var(--slate);
    font-weight: 700;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  html[data-theme="dark"] .theme-toggle { border-color: var(--teal-bright); color: var(--teal-bright); }

  /* Tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 24px 0 18px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: var(--card-bg);
    border: 2px solid var(--slate);
    color: var(--slate);
    font-weight: 700;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  html[data-theme="dark"] .tab-btn { border-color: var(--teal-bright); color: var(--teal-bright); }
  .tab-btn.active { background: var(--slate); color: #fff; }
  html[data-theme="dark"] .tab-btn.active { background: var(--teal-bright); color: var(--slate-dark); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .week-selector { display: flex; gap: 6px; margin-bottom: 14px; }
  .week-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card-bg); color: var(--slate); font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .week-btn.active { background: var(--slate); color: #fff; border-color: var(--slate); }
  html[data-theme="dark"] .week-btn.active { background: var(--teal-bright); color: var(--slate-dark); border-color: var(--teal-bright); }
  .sched-team { color: var(--slate); }
  html[data-theme="dark"] .sched-team { color: var(--ink); }
  .sched-team.fav { color: var(--orange); font-weight: 700; }
  html[data-theme="dark"] .sched-team.fav { color: var(--orange); }
  .sched-at { color: var(--muted); margin: 0 6px; }
  .sched-neutral { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
  .sched-tb-row { outline: 2px solid var(--slate); outline-offset: -1px; }
  html[data-theme="dark"] .sched-tb-row { outline-color: var(--teal-bright); }
  .sched-tb-badge {
    display: inline-block; margin-left: 8px; background: var(--slate); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 2px 6px; border-radius: 3px;
  }
  html[data-theme="dark"] .sched-tb-badge { background: var(--teal-bright); color: var(--slate-dark); }
  .print-btn {
    margin-left: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card-bg); color: var(--slate); font-weight: 700; font-size: 12px; cursor: pointer;
  }
  html[data-theme="dark"] .print-btn { color: var(--ink); }
  .print-only { display: none; }
  @media print {
    .no-print { display: none !important; }
    .print-only { display: block !important; margin: 0 0 10px; font-size: 20px; }
    body, .wrap { background: #fff !important; }
    .tab-panel { display: none !important; }
    #tab-schedule { display: block !important; }
    table, th, td { color: #000 !important; background: #fff !important; border-color: #999 !important; }
    .sched-team.fav { color: #000 !important; font-weight: 900 !important; text-decoration: underline; }
    .sched-tb-row { outline: 2px solid #000 !important; }
    .sched-tb-badge { background: #000 !important; color: #fff !important; }
  }

  /* Tables */
  .table-scroll {
    overflow-x: auto;
    overflow-y: visible;
    border: 2px solid var(--slate);
    border-radius: 10px;
    background: var(--card-bg);
  }
  html[data-theme="dark"] .table-scroll { border-color: var(--teal-bright); }
  /* Standings: no horizontal scroll, columns fit the page, header stays visible while scrolling */
  .standings-wrap {
    overflow-x: visible;
    border: 2px solid var(--slate);
    border-radius: 10px;
    background: var(--card-bg);
  }
  html[data-theme="dark"] .standings-wrap { border-color: var(--teal-bright); }
  .standings-wrap table { table-layout: fixed; width: 100%; }
  .standings-wrap thead th { position: sticky; top: 0; z-index: 3; }
  .standings-wrap td, .standings-wrap th { white-space: normal; }
  .standings-wrap td { word-break: break-word; }
  .standings-wrap th { overflow-wrap: normal; word-break: normal; }
  .standings-wrap td.player-name { position: static; }
  .standings-wrap th:nth-child(1), .standings-wrap td:nth-child(1) { width: 10%; white-space: nowrap; text-align: center; padding-left: 6px; padding-right: 6px; }
  .standings-wrap th:nth-child(2), .standings-wrap td:nth-child(2) { width: 23%; }
  .standings-wrap th:nth-child(3), .standings-wrap td:nth-child(3) { width: 15%; }
  .standings-wrap th:nth-child(4), .standings-wrap td:nth-child(4) { width: 16%; }
  .standings-wrap th:nth-child(5), .standings-wrap td:nth-child(5) { width: 12%; }
  .standings-wrap th:nth-child(6), .standings-wrap td:nth-child(6) { width: 12.5%; }
  .standings-wrap th:nth-child(7), .standings-wrap td:nth-child(7) { width: 12.5%; }
  table { border-collapse: collapse; width: 100%; }
  #picksTable { table-layout: fixed; }
  thead th {
    background: var(--slate);
    color: #fff;
    text-align: left;
    padding: 10px 14px;
    font-size: 12.5px;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  html[data-theme="dark"] thead th { background: var(--slate-dark); color: var(--teal-bright); }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { background: var(--slate-light); }
  thead th .arrow { opacity: .6; font-size: 10px; margin-left: 3px; }
  tbody td {
    padding: 9px 14px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    white-space: nowrap;
    background: var(--card-bg);
  }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  td.player-name { font-weight: 700; color: var(--teal); position: sticky; left: 0; z-index: 1; width: var(--player-col-width); min-width: var(--player-col-width); max-width: var(--player-col-width); padding: 9px 3px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th.player-col { position: sticky; left: 0; top: 0; z-index: 4; width: var(--player-col-width); min-width: var(--player-col-width); max-width: var(--player-col-width); padding: 10px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.total-col { font-weight: 700; position: sticky; left: var(--player-col-width); z-index: 1; width: var(--total-col-width); min-width: var(--total-col-width); max-width: var(--total-col-width); padding: 9px 1px; text-align: center; }
  th.total-col { position: sticky; left: var(--player-col-width); top: 0; z-index: 4; width: var(--total-col-width); min-width: var(--total-col-width); max-width: var(--total-col-width); padding: 10px 1px; text-align: center; }

  /* Master sheet game columns: fixed narrow width so several games fit on a phone screen at once */
  #picksTable thead th:not(.player-col):not(.total-col) {
    width: 92px; min-width: 92px; max-width: 92px;
    white-space: normal; overflow-wrap: normal; word-break: normal;
  }
  #picksTable td.pick-cell {
    width: 92px; min-width: 92px; max-width: 92px;
    white-space: normal; overflow-wrap: break-word;
    padding: 8px 8px;
  }
  #picksTable thead th.num:last-child,
  #picksTable thead th.num:nth-last-child(2),
  #picksTable thead th.num:nth-last-child(3) {
    width: 60px; min-width: 60px; max-width: 60px;
  }

  td.num, th.num { text-align: right; }
  #picksTable2 td.num, #picksTable2 th.num { text-align: center; }
  td.rank-cell { text-align: center; font-weight: 700; color: var(--teal); padding-left: 6px; padding-right: 6px; }

  .pick-cell { position: relative; }
  .pick-cell.correct { background: var(--green-bg) !important; color: var(--green); font-weight: 700; }
  .pick-cell.incorrect { background: var(--red-bg) !important; color: var(--red); text-decoration: line-through; opacity: .8; }
  .pick-cell.dbl::after {
    content: "2x";
    display: inline-block;
    margin-left: 6px;
    background: var(--orange);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    vertical-align: middle;
  }
  .no-pick { color: var(--muted); font-style: italic; }
  .week-winner {
    background: #a8e6b8 !important;
    color: #0d4d2b !important;
    font-weight: 700;
    border-radius: 4px;
  }
  .pick-cell.locked { background: var(--card-bg); color: var(--muted); text-align: center; font-size: 15px; }

  /* Legend / results bar */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 14px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 18px;
  }
  .game-chip {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .game-chip .gnum { color: var(--orange); font-weight: 700; }
  .game-chip .matchup { color: var(--slate); font-weight: 700; display: block; margin: 2px 0; }
  html[data-theme="dark"] .game-chip .matchup { color: var(--teal-bright); }
  .game-chip .status { color: var(--muted); }
  .game-chip .status.decided { color: var(--green); font-weight: 700; }
  .game-chip .score-row {
    display: flex; justify-content: space-between; font-size: 13px; margin-top: 2px;
  }
  .game-chip .score-row.winner { font-weight: 700; color: var(--green); }
  .game-chip .score-row.loser { color: var(--muted); }
  .pick-pct-row {
    display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700;
    margin-top: 8px; margin-bottom: 3px;
  }
  .pick-pct-row .pick-pct-fav { color: var(--orange); }
  .pick-pct-row .pick-pct-dog { color: var(--slate); }
  html[data-theme="dark"] .pick-pct-row .pick-pct-dog { color: var(--ink); }
  .pick-pct-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
  .pick-pct-seg.fav { background: var(--orange); }
  .pick-pct-seg.dog { background: var(--slate); }
  html[data-theme="dark"] .pick-pct-seg.dog { background: var(--slate-light); }

  footer { margin-top: 26px; text-align: center; font-size: 13px; color: var(--slate); }
  html[data-theme="dark"] footer { color: var(--teal-bright); }

  .section-note {
    max-width: 720px;
    margin: 0 auto 18px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    thead th, tbody td { padding: 7px 10px; font-size: 12px; }
    h1 { font-size: 26px; }
    .theme-toggle { position: static; display: inline-block; margin-top: 10px; }
    #picksTable thead th:not(.player-col):not(.total-col) {
      width: 76px; min-width: 76px; max-width: 76px; font-size: 11px; padding: 6px 6px;
    }
    #picksTable td.pick-cell { width: 76px; min-width: 76px; max-width: 76px; font-size: 11.5px; padding: 6px 6px; }
    #picksTable td.player-name, #picksTable th.player-col { font-size: 11px; padding: 6px 3px; }
    #picksTable td.total-col, #picksTable th.total-col { padding: 6px 1px; }
    .pick-cell.dbl::after { margin-left: 3px; padding: 1px 3px; font-size: 8.5px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="no-print">
    <button class="theme-toggle no-print" id="themeToggle">Dark mode</button>
    <h1>Nick's Pick 'Em</h1>
    <div class="subtitle">2026 Season</div>
    <div class="last-updated" id="lastUpdated"></div>
  </header>

  <div class="tabs no-print">
    <button class="tab-btn active" data-tab="standings">Standings</button>
    <button class="tab-btn" data-tab="pickgrid">Pick Grid</button>
    <button class="tab-btn" data-tab="schedule">Schedule</button>
  </div>

  <!-- STANDINGS TAB -->
  <div class="tab-panel active" id="tab-standings">
    <div class="section-note">Ranked by season total. Click any column header to sort.</div>
    <div class="standings-wrap">
      <table id="standingsTable">
        <thead>
          <tr id="standingsHeaderRow">
            <th class="sortable num" data-key="rank">Rank</th>
            <th class="sortable player-col" data-key="name">Player</th>
            <th class="sortable num" data-key="total">Total</th>
            <th class="sortable num" data-key="pct">Upset %</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- WEEK 1 PICKS TAB -->
  <!-- PICK GRID TAB (consolidated, week-selectable) -->
  <div class="tab-panel" id="tab-pickgrid">
    <div class="week-selector" id="weekSelector"></div>
    <div class="section-note" id="pickGridNote"></div>
    <div class="results-grid" id="resultsGridUnified"></div>
    <div class="legend" id="pickGridLegend"></div>
    <div class="table-scroll">
      <table id="pickGridTable">
        <thead>
          <tr id="pickGridHeaderRow"></tr>
        </thead>
        <tbody id="pickGridBody"></tbody>
      </table>
    </div>
  </div>

  <!-- SCHEDULE TAB -->
  <div class="tab-panel" id="tab-schedule">
    <div class="week-selector no-print" id="scheduleWeekSelector"></div>
    <div class="section-note no-print">
      Bold = Favorite. All times ET.
      <button id="printScheduleBtn" class="print-btn">🖨️ Print this week's schedule</button>
    </div>
    <h2 class="print-only" id="printScheduleTitle"></h2>
    <div class="table-scroll">
      <table id="scheduleTable">
        <thead>
          <tr>
            <th class="num">#</th>
            <th class="player-col">Matchup</th>
            <th>Date</th>
            <th>Time</th>
            <th>TV</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>
  </div>

  <footer id="footerNote" class="no-print"></footer>

</div>

<script>
const DATA = JSON.parse(document.getElementById('pickem-data').textContent);
const WEEK2_DATA = JSON.parse(document.getElementById('pickem-data-w2').textContent);
const WEEK3_DATA = JSON.parse(document.getElementById('pickem-data-w3').textContent);
document.getElementById('lastUpdated').textContent = "Last updated: " + LAST_UPDATED;

/* ---------- THEME TOGGLE ---------- */
(function initTheme(){
  let stored = null;
  try { stored = localStorage.getItem('pickem-theme'); } catch (e) {}
  const theme = stored || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('pickem-theme', next); } catch (e) {}
    btn.textContent = next === 'dark' ? 'Light mode' : 'Dark mode';
  });
})();

function resultsArray(){
  const arr = [];
  for (let i = 1; i <= 13; i++) arr.push(RESULTS[i] ? RESULTS[i].winner : null);
  return arr;
}

function computePlayers(){
  const resArr = resultsArray();
  const rows = DATA.players.map(p => {
    let total = 0;
    const flags = []; // true/false/null per game
    for (let i = 0; i < 13; i++) {
      const actual = resArr[i];
      let correct = null;
      if (actual) {
        correct = (p.picks[i] === actual);
        if (correct) total += p.dbl[i] ? 2 : 1;
      }
      flags.push(correct);
    }
    let upsetGames = 0, upsetCorrect = 0;
    for (let i = 0; i < 13; i++) {
      const actual = resArr[i];
      if (actual && actual !== DATA.favorites[i]) {
        upsetGames++;
        if (p.picks[i] === actual) upsetCorrect++;
      }
    }
    const pct = upsetGames > 0 ? upsetCorrect / upsetGames : 0;
    const tbDiff = (TB_ACTUAL != null && typeof p.tbGuess === 'number') ? Math.abs(p.tbGuess - TB_ACTUAL) : null;
    return { name: p.name, picks: p.picks, dbl: p.dbl, flags, total, pct, upsetGames, upsetCorrect, tbGuess: p.tbGuess, tbDiff };
  });
  rows.forEach(r => { r.rank = 1 + rows.filter(x => x.total > r.total).length; });

  // Weeks won: only meaningful once tiebreaker is entered
  if (TB_ACTUAL != null) {
    const maxTotal = Math.max(...rows.map(r => r.total));
    const contenders = rows.filter(r => r.total === maxTotal && r.tbDiff != null);
    if (contenders.length) {
      const minDiff = Math.min(...contenders.map(r => r.tbDiff));
      rows.forEach(r => { r.weeksWon = (r.total === maxTotal && r.tbDiff === minDiff) ? 1 : 0; });
    } else {
      rows.forEach(r => { r.weeksWon = 0; });
    }
  } else {
    rows.forEach(r => { r.weeksWon = 0; });
  }
  return rows;
}

const PLAYERS = computePlayers();

/* ---------- STANDINGS TAB ---------- */
function renderStandings(sortKey = 'total', dir = -1){
  const rows = computeSeason();
  const numWeeks = WEEKS_PLAYED.length;

  // Build header once (week count is fixed for this session) -- fixed columns + one per week played
  const headerRow = document.getElementById('standingsHeaderRow');
  if (headerRow.querySelectorAll('th').length < 4 + numWeeks) {
    let extra = '';
    for (let w = 1; w <= numWeeks; w++) {
      extra += `<th class="sortable num" data-key="wk${w}">${w}</th>`;
    }
    headerRow.insertAdjacentHTML('beforeend', extra);
  }

  rows.sort((a, b) => {
    const av = sortKey.startsWith('wk') ? a.weeks[parseInt(sortKey.slice(2), 10) - 1].total : a[sortKey];
    const bv = sortKey.startsWith('wk') ? b.weeks[parseInt(sortKey.slice(2), 10) - 1].total : b[sortKey];
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    // Tiebreak: when sorting by Total, the league rule is Upset % breaks the tie
    if (sortKey === 'total' && a.pct !== b.pct) return b.pct - a.pct;
    return a.name.localeCompare(b.name);
  });

  const tbody = document.getElementById('standingsBody');
  tbody.innerHTML = rows.map(r => {
    let weekCells = '';
    r.weeks.forEach(w => {
      const cls = w.won ? 'num week-winner' : 'num';
      weekCells += `<td class="${cls}" title="${w.won ? 'Won this week' : ''}">${w.total}</td>`;
    });
    return `
    <tr>
      <td class="rank-cell">${r.rank}</td>
      <td class="player-name">${r.name}</td>
      <td class="num">${r.total}</td>
      <td class="num">${Math.round(r.pct * 100)}%</td>
      ${weekCells}
    </tr>
  `;
  }).join('');
}

let standingsSort = { key: 'total', dir: -1 };
document.getElementById('standingsHeaderRow').addEventListener('click', (e) => {
  const th = e.target.closest('th.sortable');
  if (!th) return;
  const key = th.dataset.key;
  standingsSort.dir = (standingsSort.key === key) ? -standingsSort.dir : (key === 'name' ? 1 : -1);
  standingsSort.key = key;
  renderStandings(standingsSort.key, standingsSort.dir);
});

/* ---------- WEEK 2 TAB DATA ---------- */
const WEEK2_RESULTS = {
  1: { winner: "Boston College", score: "28-21" },
  2: { winner: "Missouri", score: "38-21" },
  3: { winner: "Michigan", score: "17-10" },
  4: { winner: "Wake Forest", score: "38-36" },
  5: { winner: "South Florida", score: "28-24" },
  6: { winner: "Mississippi State", score: "38-13" },
  8: { winner: "Duke", score: "31-27" },
  10: { winner: "BYU", score: "28-17" },
  7: { winner: "California", score: "21-18" },
  9: { winner: "Pitt", score: "12-7" },
  11: { winner: "Florida Atlantic", score: "38-30" },
  12: { winner: "Texas", score: "24-23" },
  13: { winner: "North Dakota State", score: "38-32" },
}; // filled in as games are decided
const WEEK2_TB_ACTUAL = 19; // Pitt 12 + UCF 7 — the designated Week 2 tiebreaker game

function weekResultsArray(resultsObj){
  const arr = [];
  for (let i = 1; i <= 13; i++) arr.push(resultsObj[i] ? resultsObj[i].winner : null);
  return arr;
}

// Reveal rule: Saturday games all unlock together at noon ET; any other day,
// each game unlocks individually at its own kickoff time. The exact reveal
// threshold per game is precomputed in each week's DATA.revealAt.
function computeDayReveal(weekData){
  const now = Date.now();
  return weekData.revealAt.map(iso => now >= new Date(iso).getTime());
}

function computeWeekPlayers(weekData, resultsObj, tbActual){
  const resArr = weekResultsArray(resultsObj);
  const rows = weekData.players.map(p => {
    let total = 0;
    const flags = [];
    for (let i = 0; i < 13; i++) {
      const actual = resArr[i];
      let correct = null;
      if (actual) {
        correct = (p.picks[i] === actual);
        if (correct) total += p.dbl[i] ? 2 : 1;
      }
      flags.push(correct);
    }
    let upsetGames = 0, upsetCorrect = 0;
    for (let i = 0; i < 13; i++) {
      const actual = resArr[i];
      if (actual && actual !== weekData.favorites[i]) {
        upsetGames++;
        if (p.picks[i] === actual) upsetCorrect++;
      }
    }
    const pct = upsetGames > 0 ? upsetCorrect / upsetGames : 0;
    const tbDiff = (tbActual != null && typeof p.tbGuess === 'number') ? Math.abs(p.tbGuess - tbActual) : null;
    return { name: p.name, picks: p.picks, dbl: p.dbl, flags, total, pct, upsetGames, upsetCorrect, tbGuess: p.tbGuess, tbDiff };
  });

  if (tbActual != null) {
    const maxTotal = Math.max(...rows.map(r => r.total));
    const contenders = rows.filter(r => r.total === maxTotal && r.tbDiff != null);
    if (contenders.length) {
      const minDiff = Math.min(...contenders.map(r => r.tbDiff));
      rows.forEach(r => { r.weeksWon = (r.total === maxTotal && r.tbDiff === minDiff) ? 1 : 0; });
    } else {
      rows.forEach(r => { r.weeksWon = 0; });
    }
  } else {
    rows.forEach(r => { r.weeksWon = 0; });
  }
  return rows;
}
const WEEK2_PLAYERS = computeWeekPlayers(WEEK2_DATA, WEEK2_RESULTS, WEEK2_TB_ACTUAL);

const WEEK3_RESULTS = {}; // filled in as games are decided
const WEEK3_TB_ACTUAL = null; // LSU at Ole Miss is the designated Week 3 tiebreaker game
const WEEK3_PLAYERS = computeWeekPlayers(WEEK3_DATA, WEEK3_RESULTS, WEEK3_TB_ACTUAL);

// ---------- SEASON-WIDE COMBINATION (all weeks played so far) ----------
const WEEKS_PLAYED = [PLAYERS, WEEK2_PLAYERS, WEEK3_PLAYERS]; // append WEEK4_PLAYERS, etc. as future weeks are added

function computeSeason(){
  const names = WEEKS_PLAYED[0].map(p => p.name);
  const rows = names.map(name => {
    const weeks = WEEKS_PLAYED.map(wk => {
      const p = wk.find(x => x.name === name);
      return { total: p ? p.total : 0, won: !!(p && p.weeksWon) };
    });
    const seasonTotal = weeks.reduce((a, w) => a + w.total, 0);
    let upsetGames = 0, upsetCorrect = 0;
    WEEKS_PLAYED.forEach(wk => {
      const p = wk.find(x => x.name === name);
      if (p) {
        upsetGames += p.upsetGames || 0;
        upsetCorrect += p.upsetCorrect || 0;
      }
    });
    const pct = upsetGames > 0 ? upsetCorrect / upsetGames : 0;
    return { name, total: seasonTotal, pct, weeks };
  });
  rows.forEach(r => { r.rank = 1 + rows.filter(x => x.total > r.total).length; });
  return rows;
}

/* ---------- PICK GRID TAB (consolidated across all weeks) ---------- */
const WEEKS_CONFIG = [
  {
    num: 1, data: DATA, resultsObj: RESULTS, players: PLAYERS, hasReveal: false,
    noteText: 'Green = correct, red = missed, navy "2x" = that player\'s own double-point pick for the week.'
  },
  {
    num: 2, data: WEEK2_DATA, resultsObj: WEEK2_RESULTS, players: WEEK2_PLAYERS, hasReveal: true,
    noteText: "Each game unlocks at its own kickoff time — except Saturday's games, which all unlock together at noon ET."
  },
  {
    num: 3, data: WEEK3_DATA, resultsObj: WEEK3_RESULTS, players: WEEK3_PLAYERS, hasReveal: true,
    noteText: "Each game unlocks at its own kickoff time — except Saturday's games, which all unlock together at noon ET."
  },
  // append a { num: 4, data: WEEK4_DATA, ... } entry here for each future week
];
let currentWeekIdx = WEEKS_CONFIG.length - 1; // default to the most recent week
let pickGridSort = { key: 'total', dir: -1 };

function computePickPct(cfg, gameIdx){
  const fav = cfg.data.favorites[gameIdx];
  let favCount = 0, dogCount = 0;
  cfg.players.forEach(p => {
    const pick = p.picks[gameIdx];
    if (!pick || pick === 'NO PICK') return;
    if (pick === fav) favCount++;
    else dogCount++;
  });
  const total = favCount + dogCount;
  if (total === 0) return null;
  return { fav, favPct: Math.round((favCount / total) * 100), dogPct: Math.round((dogCount / total) * 100) };
}

function pickBarHtml(cfg, i){
  const pct = computePickPct(cfg, i);
  if (!pct) return '';
  const dogTeam = cfg.data.opponents[i].find(t => t !== pct.fav);
  return `
    <div class="pick-pct-row">
      <span class="pick-pct-fav">${pct.fav} ${pct.favPct}%</span>
      <span class="pick-pct-dog">${pct.dogPct}% ${dogTeam}</span>
    </div>
    <div class="pick-pct-bar">
      <div class="pick-pct-seg fav" style="width:${pct.favPct}%"></div>
      <div class="pick-pct-seg dog" style="width:${pct.dogPct}%"></div>
    </div>
  `;
}

function renderResultsGridUnified(weekIdx){
  const cfg = WEEKS_CONFIG[weekIdx];
  const grid = document.getElementById('resultsGridUnified');
  const revealed = cfg.hasReveal ? computeDayReveal(cfg.data) : cfg.data.labels.map(() => true);
  grid.innerHTML = cfg.data.labels.map((label, i) => {
    const [num, matchup] = label.split('\n');
    const result = cfg.resultsObj[i + 1];
    const winner = result ? result.winner : null;
    const bar = revealed[i] ? pickBarHtml(cfg, i) : '';

    if (!winner) {
      if (cfg.hasReveal && cfg.data.kickoffs) {
        const kickoff = new Date(cfg.data.kickoffs[i]);
        const dateStr = kickoff.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric', timeZone: 'America/New_York' }).replace(',', '');
        const timeStr = kickoff.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }).replace(' ', '');
        return `
          <div class="game-chip">
            <span class="gnum">Game ${num}</span>
            <span class="matchup">${matchup}</span>
            <span class="status">${dateStr} ${timeStr}</span>
            ${bar}
          </div>
        `;
      }
      return `
        <div class="game-chip">
          <span class="gnum">Game ${num}</span>
          <span class="matchup">${matchup}</span>
          <span class="status">Not yet played</span>
          ${bar}
        </div>
      `;
    }
    const loser = cfg.data.opponents[i].find(t => t !== winner);
    if (!result.score) {
      return `
        <div class="game-chip">
          <span class="gnum">Game ${num}</span>
          <span class="matchup">${matchup}</span>
          <span class="status decided">${winner}</span>
          ${bar}
        </div>
      `;
    }
    const parts = result.score.split('-');
    return `
      <div class="game-chip">
        <span class="gnum">Game ${num}</span>
        <span class="matchup">${matchup}</span>
        <div class="score-row winner"><span>${winner}</span><span>${parts[0] || ''}</span></div>
        <div class="score-row loser"><span>${loser || ''}</span><span>${parts[1] || ''}</span></div>
        ${bar}
      </div>
    `;
  }).join('');
}

function renderPickGrid(weekIdx, sortKey = 'total', dir = -1){
  const cfg = WEEKS_CONFIG[weekIdx];
  const revealed = cfg.hasReveal ? computeDayReveal(cfg.data) : cfg.data.labels.map(() => true);
  // Tiebreaker guesses stay hidden until every game in the week has unlocked
  // (i.e. until Saturday noon ET), so nobody can see others' guesses early.
  const tbRevealed = cfg.hasReveal ? revealed.every(r => r) : true;

  document.getElementById('pickGridNote').textContent = `Every player's picks for Week ${cfg.num}. ${cfg.noteText}`;

  let legendHtml = `
    <span><span class="swatch" style="background:var(--green-bg);border:1px solid var(--green)"></span> Correct pick</span>
    <span><span class="swatch" style="background:var(--red-bg);border:1px solid var(--red)"></span> Missed pick</span>
    <span><span class="swatch" style="background:var(--orange)"></span> 2x — player's double game</span>
  `;
  if (cfg.hasReveal) legendHtml += `<span>🔒 Locked until kickoff</span>`;
  document.getElementById('pickGridLegend').innerHTML = legendHtml;

  const headerRow = document.getElementById('pickGridHeaderRow');
  let headerHtml = `<th class="player-col sortable" data-key="name">Player</th><th class="total-col sortable" data-key="total">Total</th>`;
  cfg.data.labels.forEach(label => {
    const [num, matchup] = label.split('\n');
    headerHtml += cfg.hasReveal ? `<th>${matchup}</th>` : `<th>${num}<br>${matchup}</th>`;
  });
  headerHtml += `<th class="num">TB Guess</th><th class="num">TB Diff</th>`;
  headerRow.innerHTML = headerHtml;

  const sorted = [...cfg.players].sort((a, b) => {
    let cmp;
    if (sortKey === 'name') cmp = a.name.localeCompare(b.name);
    else cmp = a.total - b.total;
    if (cmp !== 0) return cmp * dir;
    return a.name.localeCompare(b.name);
  });
  const tbody = document.getElementById('pickGridBody');
  tbody.innerHTML = sorted.map(r => {
    let cells = `<td class="player-name">${r.name}</td>`;
    cells += `<td class="total-col">${r.total}</td>`;
    r.picks.forEach((pick, i) => {
      if (cfg.hasReveal && !revealed[i]) {
        if (!pick) {
          cells += `<td class="pick-cell locked"><span class="no-pick">—</span></td>`;
        } else {
          cells += `<td class="pick-cell locked">🔒</td>`;
        }
        return;
      }
      const flag = r.flags[i];
      const classes = ['pick-cell'];
      if (flag === true) classes.push('correct');
      if (flag === false) classes.push('incorrect');
      if (r.dbl[i]) classes.push('dbl');
      const text = pick && pick !== 'NO PICK' ? pick : `<span class="no-pick">—</span>`;
      cells += `<td class="${classes.join(' ')}">${text}</td>`;
    });
    if (tbRevealed) {
      cells += `<td class="num">${r.tbGuess != null ? r.tbGuess : '—'}</td>`;
      cells += `<td class="num">${r.tbDiff != null ? r.tbDiff : '—'}</td>`;
    } else {
      const hasGuess = typeof r.tbGuess === 'number';
      cells += `<td class="num pick-cell locked">${hasGuess ? '🔒' : '<span class="no-pick">—</span>'}</td>`;
      cells += `<td class="num pick-cell locked">${hasGuess ? '🔒' : '<span class="no-pick">—</span>'}</td>`;
    }
    return `<tr>${cells}</tr>`;
  }).join('');
}

function renderWeekSelector(){
  const sel = document.getElementById('weekSelector');
  sel.innerHTML = WEEKS_CONFIG.map((cfg, i) =>
    `<button class="week-btn ${i === currentWeekIdx ? 'active' : ''}" data-week-idx="${i}">${cfg.num}</button>`
  ).join('');
}

function switchWeek(idx){
  currentWeekIdx = idx;
  pickGridSort = { key: 'total', dir: -1 };
  renderWeekSelector();
  renderResultsGridUnified(idx);
  renderPickGrid(idx, pickGridSort.key, pickGridSort.dir);
}

document.getElementById('weekSelector').addEventListener('click', (e) => {
  const btn = e.target.closest('.week-btn');
  if (!btn) return;
  switchWeek(parseInt(btn.dataset.weekIdx, 10));
});

document.getElementById('pickGridHeaderRow').addEventListener('click', (e) => {
  const th = e.target.closest('th.sortable');
  if (!th) return;
  const key = th.dataset.key;
  pickGridSort.dir = (pickGridSort.key === key) ? -pickGridSort.dir : (key === 'name' ? 1 : -1);
  pickGridSort.key = key;
  renderPickGrid(currentWeekIdx, pickGridSort.key, pickGridSort.dir);
});

/* ---------- SCHEDULE TAB ---------- */
let currentScheduleWeekIdx = WEEKS_CONFIG.length - 1;

function renderScheduleWeekSelector(){
  const sel = document.getElementById('scheduleWeekSelector');
  sel.innerHTML = WEEKS_CONFIG.map((cfg, i) =>
    `<button class="week-btn ${i === currentScheduleWeekIdx ? 'active' : ''}" data-week-idx="${i}">${cfg.num}</button>`
  ).join('');
}

function renderSchedule(weekIdx){
  const cfg = WEEKS_CONFIG[weekIdx];
  const tbody = document.getElementById('scheduleBody');
  tbody.innerHTML = cfg.data.labels.map((label, i) => {
    const [num] = label.split('\n');
    const [away, home] = cfg.data.opponents[i];
    const fav = cfg.data.favorites[i];
    const neutral = cfg.data.neutralSites ? cfg.data.neutralSites[i] : null;

    const awayCls = away === fav ? 'sched-team fav' : 'sched-team';
    const homeCls = home === fav ? 'sched-team fav' : 'sched-team';
    const sep = neutral ? 'vs' : '@';
    const neutralNote = neutral ? `<span class="sched-neutral">Neutral site: ${neutral}</span>` : '';

    let dateStr = '', timeStr = '';
    if (cfg.data.kickoffs) {
      const kickoff = new Date(cfg.data.kickoffs[i]);
      dateStr = kickoff.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric', timeZone: 'America/New_York' }).replace(',', '');
      timeStr = kickoff.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }).replace(' ', '') + ' ET';
    }

    const isTiebreaker = cfg.data.tiebreakerGame === (i + 1);
    const rowCls = isTiebreaker ? 'sched-tb-row' : '';
    const tbBadge = isTiebreaker ? '<span class="sched-tb-badge">TIEBREAKER</span>' : '';

    return `
      <tr class="${rowCls}">
        <td class="num">${num}</td>
        <td class="player-col">
          <span class="${awayCls}">${away}</span><span class="sched-at">${sep}</span><span class="${homeCls}">${home}</span>${tbBadge}
          ${neutralNote}
        </td>
        <td>${dateStr}</td>
        <td>${timeStr}</td>
        <td>${cfg.data.tvChannels ? (cfg.data.tvChannels[i] || '') : ''}</td>
      </tr>
    `;
  }).join('');
}

document.getElementById('scheduleWeekSelector').addEventListener('click', (e) => {
  const btn = e.target.closest('.week-btn');
  if (!btn) return;
  currentScheduleWeekIdx = parseInt(btn.dataset.weekIdx, 10);
  renderScheduleWeekSelector();
  renderSchedule(currentScheduleWeekIdx);
});

document.getElementById('printScheduleBtn').addEventListener('click', () => {
  const weekNum = WEEKS_CONFIG[currentScheduleWeekIdx].num;
  document.getElementById('printScheduleTitle').textContent = `Nick's Pick 'Em \u2014 2026 Season \u2014 Week ${weekNum} Schedule`;
  window.print();
});

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ---------- FOOTER ---------- */
document.getElementById('footerNote').textContent =
  DATA.players.length + ' players \u2022 13 games per week \u2022 2026 season';

/* ---------- INITIAL RENDER ---------- */
renderStandings();
renderWeekSelector();
renderResultsGridUnified(currentWeekIdx);
renderPickGrid(currentWeekIdx, pickGridSort.key, pickGridSort.dir);
renderScheduleWeekSelector();
renderSchedule(currentScheduleWeekIdx);
</script>
